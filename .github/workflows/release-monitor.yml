# .github/workflows/release-monitor.yml

name: Build and Release Elastic Package Registry

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build packages and run smoke tests even when no new upstream release is available."
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Create the GitHub release after a successful build."
        required: false
        default: true
        type: boolean

  # Runs on a schedule (once a day at 2:00 AM UTC)
  schedule:
    - cron: '0 2 * * *'

# Grant permissions for the GITHUB_TOKEN to create releases and write content.
permissions:
  contents: write

env:
  MAGE_VERSION: v1.17.2
  NFPM_VERSION: v2.47.0

defaults:
  run:
    shell: bash

jobs:
  build-packages:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      create_release: ${{ steps.decide.outputs.create_release }}
      tag: ${{ steps.get_epr_release.outputs.tag }}
      changelog: ${{ steps.get_epr_release.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Install Mage
        run: go install "github.com/magefile/mage@${MAGE_VERSION}"

      - name: Install nfpm
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"

      - name: Get Latest Elastic Package Registry Release
        id: get_epr_release
        run: |
          set -euo pipefail

          # Use the GitHub API to get the latest release information from the target repository
          LATEST_RELEASE_JSON=$(curl --fail --show-error --silent --location \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/elastic/package-registry/releases/latest)

          # Use jq to parse the JSON and extract the tag name and release notes (changelog)
          TAG=$(echo "$LATEST_RELEASE_JSON" | jq -r .tag_name)
          CHANGELOG=$(echo "$LATEST_RELEASE_JSON" | jq -r '.body // ""')
          TARBALL_URL=$(echo "$LATEST_RELEASE_JSON" | jq -r .tarball_url)

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "GitHub API response did not include a valid tag_name."
            exit 1
          fi

          if [ -z "$TARBALL_URL" ] || [ "$TARBALL_URL" = "null" ]; then
            echo "GitHub API response did not include a valid tarball_url."
            exit 1
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No upstream release notes were provided."
          fi

          # Pass the extracted data to subsequent steps
          {
            echo "tag=${TAG}"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
            echo "tarball_url=${TARBALL_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "Found latest Elastic Package Registry release: ${TAG}"

      - name: Get Latest Release from this Repo
        id: get_demo_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Use the GitHub CLI to get the latest release tag from the current repository
          # The `|| true` prevents the workflow from failing if no releases exist yet
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' || true)
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release in this repo: ${LATEST_TAG}"

      - name: Compare versions and decide to proceed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          set -euo pipefail

          proceed=false
          create_release=false

          if [ "${{ steps.get_epr_release.outputs.tag }}" != "${{ steps.get_demo_release.outputs.tag }}" ]; then
            echo "New version found. Proceeding with build."
            proceed=true

            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$PUBLISH_RELEASE" = "true" ]; then
              create_release=true
            else
              echo "Manual dry run requested. Release creation will be skipped."
            fi
          elif [ "$FORCE_BUILD" = "true" ]; then
            echo "No new version found, but force_build=true. Proceeding with build and smoke tests."
            proceed=true
          else
            echo "The latest release in this repo already matches the elastic/package-registry release. Nothing to do."
          fi

          {
            echo "proceed=${proceed}"
            echo "create_release=${create_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and Extract Source Archive
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          # Download the tarball and extract it.
          # The `strip-components=1` option removes the top-level directory from the archive,
          # placing the contents directly into the 'source' directory.
          mkdir -p source
          curl --fail --show-error --silent --location \
            --output source.tar.gz \
            "${{ steps.get_epr_release.outputs.tarball_url }}"
          tar xzf source.tar.gz -C source --strip-components=1
          echo "Source code downloaded and extracted to ./source"
          ls -la ./source

      - name: Build Binary from Source
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          GO_VERSION=$(go env GOVERSION | sed 's/^go//')
          echo "Building binary using mage inside rockylinux:8 with Go ${GO_VERSION}..."

          # shellcheck disable=SC2016
          docker run --rm \
            --env "GO_VERSION=${GO_VERSION}" \
            --env "MAGE_VERSION=${MAGE_VERSION}" \
            --volume "$PWD/source:/workspace/source" \
            --workdir /workspace/source \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              dnf install -y ca-certificates curl gcc git gzip make tar >/dev/null
              curl --fail --show-error --silent --location \
                --output /tmp/go.tgz \
                "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
              tar -C /usr/local -xzf /tmp/go.tgz

              export PATH="/usr/local/go/bin:/root/go/bin:${PATH}"
              go version
              go install "github.com/magefile/mage@${MAGE_VERSION}"
              mage build

              test -x package-registry
              ./package-registry --version
            '

          echo "Build complete. Checking for binary:"
          ls -l source/package-registry
          test -x source/package-registry
          docker run --rm \
            --volume "$PWD/source/package-registry:/usr/local/bin/package-registry:ro" \
            rockylinux:8 \
            /usr/local/bin/package-registry --version

      - name: Modify config.yml
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          CONFIG_FILE=./source/config.yml
          echo "Original config.yml content:"
          cat "$CONFIG_FILE"
          # Replace the first package path
          sed -i 's|- ./testdata/package|- /var/package-registry/packages|g' "$CONFIG_FILE"
          # Remove the second package path line
          sed -i '/- .\/testdata\/local-storage/d' "$CONFIG_FILE"
          grep -F -- "- /var/package-registry/packages" "$CONFIG_FILE"
          echo "Modified config.yml content:"
          cat "$CONFIG_FILE"

      - name: Build Packages with nfpm
        if: steps.decide.outputs.proceed == 'true'
        env:
          # This environment variable will be expanded by nfpm inside the nfpm.yaml file.
          PACKAGE_VERSION: ${{ steps.get_epr_release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Building packages for version ${PACKAGE_VERSION}..."
          # The version is now correctly set inside nfpm.yaml via env var expansion.
          ~/go/bin/nfpm package -f nfpm.yaml --packager deb --target .
          ~/go/bin/nfpm package -f nfpm.yaml --packager rpm --target .
          echo "Packages built:"
          ls -l ./*.deb ./*.rpm

      - name: Create Tar.gz Archive
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "Creating tar.gz archive..."
          PACKAGE_VERSION=${{ steps.get_epr_release.outputs.tag }}
          ARCHIVE_NAME="elastic-package-registry-${PACKAGE_VERSION}"
          # Create a staging directory to gather all files
          mkdir -p "staging/${ARCHIVE_NAME}/etc/package-registry"
          mkdir -p "staging/${ARCHIVE_NAME}/usr/local/bin"
          mkdir -p "staging/${ARCHIVE_NAME}/scripts"

          # Copy all the necessary artifacts into the staging directory
          cp ./source/package-registry "staging/${ARCHIVE_NAME}/usr/local/bin/"
          cp ./source/config.yml "staging/${ARCHIVE_NAME}/etc/package-registry/"
          cp ./package-registry-env.conf "staging/${ARCHIVE_NAME}/etc/package-registry/"
          cp ./package-registry.service "staging/${ARCHIVE_NAME}/"
          cp ./scripts/postinstall.sh "staging/${ARCHIVE_NAME}/scripts/"
          cp ./scripts/preremove.sh "staging/${ARCHIVE_NAME}/scripts/"

          # Create the tarball from the staging directory
          cd staging
          tar -czf "../${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          cd ..
          echo "Archive created: ${ARCHIVE_NAME}.tar.gz"

      - name: Generate Checksums
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "Generating checksums for packages..."
          for pkg in ./*.deb ./*.rpm ./*.tar.gz; do
            md5sum "$pkg" > "${pkg}.md5"
            sha256sum "$pkg" > "${pkg}.sha256"
          done
          echo "Checksums generated:"
          ls -l ./*.md5 ./*.sha256

      - name: Upload package artifacts
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          path: |
            ./*.deb
            ./*.rpm
            ./*.tar.gz
            ./*.md5
            ./*.sha256
          if-no-files-found: error

      - name: No new version found
        if: steps.decide.outputs.proceed != 'true'
        run: |
          set -euo pipefail

          echo "The latest release in this repo already matches the elastic/package-registry release. Nothing to do."

  smoke-test-packages:
    if: needs.build-packages.outputs.proceed == 'true'
    needs: build-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04-deb
            package_type: deb
            container_image: ubuntu:26.04
            package_glob: "*.deb"
          - name: ubuntu-24.04-deb
            package_type: deb
            container_image: ubuntu:24.04
            package_glob: "*.deb"
          - name: debian-13-deb
            package_type: deb
            container_image: debian:13
            package_glob: "*.deb"
          - name: debian-12-deb
            package_type: deb
            container_image: debian:12
            package_glob: "*.deb"
          - name: rockylinux-9-rpm
            package_type: rpm
            container_image: rockylinux:9
            package_glob: "*.rpm"
          - name: rockylinux-8-rpm
            package_type: rpm
            container_image: rockylinux:8
            package_glob: "*.rpm"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts

      - name: Smoke test package on ${{ matrix.container_image }}
        run: |
          set -euo pipefail

          PACKAGE=$(find . -maxdepth 1 -type f -name '${{ matrix.package_glob }}' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "Expected package artifact matching ${{ matrix.package_glob }}."
            exit 1
          fi

          ./scripts/smoke_test_package.sh \
            '${{ matrix.package_type }}' \
            '${{ matrix.container_image }}' \
            "$PACKAGE"

  release:
    if: needs.build-packages.outputs.create_release == 'true'
    needs:
      - build-packages
      - smoke-test-packages
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ needs.build-packages.outputs.changelog }}
          RELEASE_TAG: ${{ needs.build-packages.outputs.tag }}
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          # Create a new release using the GitHub CLI, uploading all packages and their checksums.
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md \
            ./*.deb ./*.rpm ./*.tar.gz ./*.md5 ./*.sha256
          echo "Successfully created release $RELEASE_TAG"
